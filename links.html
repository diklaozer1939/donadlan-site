<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>קישורים לפרסום | דו נדל"ן</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#FBF5EC;color:#1D191C}
header{background:#121012;padding:12px 16px;text-align:center}
header img{height:44px;margin:0 auto;display:block}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
p.s{color:#5E5458;margin:0 0 20px}
article{background:#fff;border:1px solid #EADFD3;border-radius:14px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
article a{display:block;color:#A80F60;font-size:14px;direction:ltr;text-align:right;word-break:break-all}
.st{font-size:13px;border-radius:999px;padding:3px 10px;align-self:flex-start}
.st.ok{background:#EAF4EC;color:#1E6B3A}
.st.new{background:#FCE7F2;color:#A80F60}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid #EADFD3;border-radius:8px;padding:8px;resize:vertical}
.b{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:10px 18px;background:#D4147A;color:#fff;cursor:pointer}
button+button{background:#121012}
</style>
<script src="/js/pixel.js" async></script>
</head>
<body>
<header><img src="/img/logo.png" alt="דו נדל&quot;ן"></header>
<main>
<h1>קישורים לפרסום בפייסבוק</h1>
<p class="s">הדף הזה לא מופיע באתר ולא בגוגל. הוא מתעדכן ישר מהגיליון: נכס חדש מופיע כאן תוך דקה-שתיים מרגע שהוספת אותו.</p>
<div id="list">טוען...</div>
</main>
<script src="/js/live.js"></script>
<script>
DN.loadListings().then(list => {
  const open = list.filter(l => l.kind !== "closed");
  document.getElementById("list").innerHTML = open.length ? open.map(l => `<article>
    <div><b>${DN.esc(l.status)} · ${DN.esc(l.title)}</b><a href="/n/${l.id}/">${DN.pageUrl(l)}</a></div>
    ${l.built ? `<span class="st ok">מוכן, כולל תמונה בתצוגה של פייסבוק</span>` : `<span class="st new">חדש: הקישור כבר עובד. התמונה בתצוגה של פייסבוק תתווסף תוך כמה שעות</span>`}
    <textarea readonly rows="7">${DN.esc(DN.postText(l))}</textarea>
    <div class="b"><button data-copy="${DN.esc(DN.pageUrl(l))}">העתקת קישור</button><button data-post>העתקת פוסט מוכן</button></div>
  </article>`).join("") : "<p>אין כרגע נכסים פעילים.</p>";
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = b.closest("article").querySelector("textarea");
  const text = b.dataset.copy || t.value;
  try { await navigator.clipboard.writeText(text); } catch (_) { t.select(); document.execCommand("copy"); }
  const old = b.textContent; b.textContent = "הועתק ✓"; setTimeout(() => b.textContent = old, 1500);
});
</script>
</body>
</html>
