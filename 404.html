<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דו נדל"ן – דקלה עוזר</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="דקלה עוזר | דו נדל&quot;ן">
<meta property="og:description" content="משרד תיווך בוטיק בפתח תקווה, בקעת אונו והסביבה.">
<meta property="og:image" content="https://donadlan.co.il/img/og.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/rubik-hebrew-400-normal.woff2" crossorigin>
<link rel="stylesheet" href="/css/property.css">
<link rel="stylesheet" href="/css/a11y.css">
</head>
<body>
<a class="skip" href="#app">דילוג לתוכן הראשי</a>
<header><div class="wrap bar">
  <a class="brand" href="/"><img src="/img/logo.png" alt="דו נדל&quot;ן" width="260" height="162"></a>
  <a class="all" href="/#properties">לכל הנכסים</a>
</div></header>
<main class="wrap" id="app" tabindex="-1"><p class="notfound">טוען...</p></main>
<footer><div class="wrap">© דו נדל"ן – דקלה עוזר · 055-8836333
  <nav class="legal" aria-label="מידע משפטי"><a href="/accessibility/">הצהרת נגישות</a><a href="/privacy/">מדיניות פרטיות</a></nav></div></footer>
<a class="sticky-wa" id="sticky" href="https://wa.me/972558836333">דברו איתי בוואטסאפ</a>
<script src="/js/live.js"></script>
<script src="/js/gallery.js"></script>
<script src="/js/a11y.js"></script>
<script>
(async () => {
  const app = document.getElementById("app");
  const notFound = () => {
    app.innerHTML = `<div class="notfound"><img src="/img/logo.png" alt="">
      <h1>הדף הזה לא נמצא</h1>
      <p>ייתכן שהנכס כבר נמכר או הושכר. יש לי עוד נכסים, ואשמח לעזור לכם למצוא.</p>
      <a class="btn wa" href="https://wa.me/${DN.WA}">דברו איתי בוואטסאפ</a>
      <a class="btn ghost" href="/#properties">לכל הנכסים</a></div>`;
  };
  const m = location.pathname.match(/^\/n\/([\w-]+)\/?$/);
  if (!m) return notFound();
  const list = await DN.loadListings();
  const l = list.find(x => x.id === m[1] || x.oldId === m[1]);
  if (!l) return notFound();
  if (l.id !== m[1]) { location.replace(`/n/${l.id}/`); return; }
  document.title = `${l.status}: ${l.title} | דו נדל"ן`;
  app.innerHTML = DN.renderProperty(l, list.filter(o => o.id !== l.id && o.kind !== "closed"));
  dnGallery(app);
  const s = document.getElementById("sticky");
  s.href = DN.waLink(DN.waText(l));
  s.textContent = l.kind === "closed" ? "יש לכם דירה דומה? דברו איתי" : "לפרטים ומחיר בוואטסאפ";
  app.querySelector(".share").addEventListener("click", async e => {
    const b = e.currentTarget, url = b.dataset.url, title = b.dataset.title;
    try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (_) { return; }
    try { await navigator.clipboard.writeText(url); b.textContent = "הקישור הועתק"; } catch (_) { prompt("העתיקו את הקישור:", url); }
  });
})();
</script>
</body>
</html>
